<script>
const tip = document.getElementById('tip'), wrap = document.querySelector('.wrap');
const svg = document.querySelector('.wrap svg');
function moveTip(e) {
  const r = wrap.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 370) + 'px';
  tip.style.top = (e.clientY - r.top + 14) + 'px';
}
function clearHl() {
  svg.classList.remove('hov');
  svg.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
  tip.style.display = 'none';
}
function showTip(el) {
  tip.innerHTML = '<b></b><span></span>';
  tip.firstChild.textContent = el.dataset.name;
  tip.lastChild.textContent = el.dataset.sub;
  tip.style.display = 'block';
}
svg.querySelectorAll('.n').forEach(n => {
  n.addEventListener('mouseenter', () => {
    svg.classList.add('hov');
    n.classList.add('hl');
    if (n.dataset.i !== undefined) {
      svg.querySelectorAll('line.e.mk' + n.dataset.i).forEach(l => {
        if (l.classList.contains('offch')) return;
        l.classList.add('hl');
        [...l.classList].filter(c => c.indexOf('el-') === 0).forEach(c => {
          const en = svg.querySelector('.n[data-id=&quot;' + c.slice(3) + '&quot;]');
          if (en) en.classList.add('hl');
        });
      });
    } else {
      svg.querySelectorAll('line.e.el-' + n.dataset.id).forEach(l => {
        if (l.classList.contains('offch')) return;
        l.classList.add('hl');
        [...l.classList].forEach(c => {
          if (c.indexOf('el-') === 0 &amp;&amp; c.slice(3) !== n.dataset.id) {
            const en = svg.querySelector('.n[data-id=&quot;' + c.slice(3) + '&quot;]');
            if (en) en.classList.add('hl');
          }
          if (c.indexOf('mk') === 0 &amp;&amp; c !== 'mk') {
            const mn = svg.querySelector('.n[data-i=&quot;' + c.slice(2) + '&quot;]');
            if (mn) mn.classList.add('hl');
          }
        });
      });
    }
    showTip(n);
  });
  n.addEventListener('mousemove', moveTip);
  n.addEventListener('mouseleave', clearHl);
});
const KINDS = ['combine', 'cancel', 'status', 'magick', 'dlc'];
const chs = new Set(KINDS);
function applyCh() {
  svg.querySelectorAll('line.e').forEach(l => {
    const kinds = [...l.classList].filter(c => c.indexOf('t-') === 0).map(c => c.slice(2));
    let off = !kinds.some(k => chs.has(k));
    if (kinds.includes('dlc') &amp;&amp; !chs.has('dlc')) off = true;
    if (kinds.includes('magick') &amp;&amp; !chs.has('magick')) off = true;
    l.classList.toggle('offch', off);
  });
  svg.querySelectorAll('.n.dlcn').forEach(n => n.classList.toggle('offn', !chs.has('dlc') || !chs.has('magick')));
  svg.querySelectorAll('.n.mk:not(.dlcn)').forEach(n => n.classList.toggle('offn', !chs.has('magick')));
  document.querySelectorAll('.lc').forEach(b => b.classList.toggle('on', chs.has(b.dataset.k)));
}
document.querySelectorAll('.lc').forEach(b => b.addEventListener('click', () => {
  if (chs.size === KINDS.length) { chs.clear(); chs.add(b.dataset.k);
    if (b.dataset.k === 'dlc') chs.add('magick'); }
  else if (chs.has(b.dataset.k)) { chs.delete(b.dataset.k); if (!chs.size) KINDS.forEach(k => chs.add(k)); }
  else chs.add(b.dataset.k);
  applyCh();
}));
document.getElementById('allch').addEventListener('click', () => {
  KINDS.forEach(k => chs.add(k));
  applyCh();
});
async function exportPNG() {
  const clone = svg.cloneNode(true);
  clone.querySelectorAll('line.e.offch,.n.offn').forEach(l => l.remove());
  clone.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
  const xml = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([xml], {type: 'image/svg+xml'}));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const c = document.createElement('canvas');
  c.width = 3000; c.height = 1960;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#101016';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
const copybtn = document.getElementById('copybtn');
function flashCopy(cls, text) {
  copybtn.classList.add(cls);
  copybtn.textContent = text;
  setTimeout(() => { copybtn.classList.remove(cls); copybtn.textContent = '⧉ copy image'; }, 2200);
}
copybtn.addEventListener('click', async () => {
  copybtn.textContent = '… rendering';
  try {
    const blob = await exportPNG();

<script>
const tip = document.getElementById('tip'), wrap = document.querySelector('.wrap');
const svg = document.querySelector('.wrap svg');
function moveTip(e) {
  const r = wrap.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 370) + 'px';
  tip.style.top = (e.clientY - r.top + 14) + 'px';
}
function clearHl() {
  svg.classList.remove('hov');
  svg.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
  tip.style.display = 'none';
}
function light(ids) {
  svg.classList.add('hov');
  ids.forEach(id => {
    const nn = svg.querySelector('.n[data-id=&quot;' + id + '&quot;]');
    if (nn) nn.classList.add('hl');
    svg.querySelectorAll('line.e.c' + id).forEach(l => l.classList.add('hl'));
    const ml = svg.querySelector('.ml.m' + id);
    if (ml) ml.classList.add('hl');
  });
}
svg.querySelectorAll('.n').forEach(n => {
  n.addEventListener('mouseenter', () => {
    const ids = (n.dataset.anc + n.dataset.desc).split('|').filter(Boolean);
    light([...new Set(ids)]);
    tip.innerHTML = '<b></b><span></span>';
    tip.firstChild.textContent = n.dataset.name;
    tip.lastChild.textContent = n.dataset.sub;
    tip.style.display = 'block';
  });
  n.addEventListener('mousemove', moveTip);
  n.addEventListener('mouseleave', clearHl);
});
svg.querySelectorAll('.ml').forEach(ml => {
  ml.addEventListener('mouseenter', () => {
    const n = svg.querySelector('.n[data-id=&quot;' + ml.dataset.for + '&quot;]');
    light(n.dataset.anc.split('|').filter(Boolean));
    tip.innerHTML = '<b></b><span></span>';
    tip.firstChild.textContent = ml.textContent;
    tip.lastChild.textContent = n.dataset.sub;
    tip.style.display = 'block';
  });
  ml.addEventListener('mousemove', moveTip);
  ml.addEventListener('mouseleave', clearHl);
});
async function exportPNG() {
  const clone = svg.cloneNode(true);
  clone.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
  const xml = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([xml], {type: 'image/svg+xml'}));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const c = document.createElement('canvas');
  c.width = 3000; c.height = 2020;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#101016';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
const copybtn = document.getElementById('copybtn');
function flashCopy(cls, text) {
  copybtn.classList.add(cls);
  copybtn.textContent = text;
  setTimeout(() => { copybtn.classList.remove(cls); copybtn.textContent = '⧉ copy image'; }, 2200);
}
copybtn.addEventListener('click', async () => {
  copybtn.textContent = '… rendering';
  try {
    const blob = await exportPNG();
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    flashCopy('ok', '✓ copied');
  } catch (e) {
    flashCopy('err', '✕ blocked');
  }
});
</script>

function pushInto(arr, eid) {
  for (let i = arr.length - 1; i >= 0; i--) {
    const s = arr[i];
    if (DOWN[eid + '|' + s]) { arr[i] = DOWN[eid + '|' + s]; return arr; }
    if ((OPP[eid] || []).includes(s)) { arr.splice(i, 1); return arr; }
    if (COMB[eid + '|' + s]) { arr[i] = COMB[eid + '|' + s]; return arr; }
  }
  if (arr.length < 5) arr.push(eid);
  return arr;
}
function classify(eid) {
  const test = Q.slice();
  pushInto(test, eid);
  if (test.length === Q.length + 1) return {ok: true, arr: test};
  if (test.length === Q.length &amp;&amp; test.some((v, i) => v !== Q[i])) return {ok: true, arr: test};
  let culprit = null;
  for (let i = Q.length - 1; i >= 0; i--) {
    if ((OPP[eid] || []).includes(Q[i])) { culprit = Q[i]; break; }
  }
  return {ok: false, full: culprit === null, culprit};
}

    ' &amp;middot; the queue stands';
}

  Q.splice(0, Q.length, ...c.arr);
  refresh();
  return true;
}

function formOf(q) {

    const rest = q.filter(e => e !== 'shield');
    if (!rest.length) return 'casts as: a barrier wall';
    if (rest.includes('earth')) return 'casts as: stone walls (shield shapes the earth)';
    return 'casts as: wards, mines or an element storm — shield turns the payload into terrain';
  }
  if (s.has('earth')) return 'casts as: a projectile — the rock carries every other element as payload';
  if (s.has('ice')) return 'casts as: a shard volley with the rest riding along';
  if (s.has('arcane') || s.has('life')) return 'casts as: a beam — the other elements ride the beam';
  return 'casts as: a spray / arc from the staff';
}

function walk(arr) {

<script>
const tip = document.getElementById('tip'), wrap = document.querySelector('.wrap');
const svg = document.querySelector('.wrap svg');
function moveTip(e) {
  const r = wrap.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 370) + 'px';
  tip.style.top = (e.clientY - r.top + 14) + 'px';
}
function clearHl() {
  svg.classList.remove('hov');
  svg.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
  tip.style.display = 'none';
}
function showTip(el) {
  tip.innerHTML = '<b></b><span></span>';
  tip.firstChild.textContent = el.dataset.name;
  tip.lastChild.textContent = el.dataset.sub;
  tip.style.display = 'block';
}
document.querySelectorAll('.n').forEach(n => {
  n.addEventListener('mouseenter', () => {
    svg.classList.add('hov');
    n.classList.add('hl');
    svg.querySelectorAll('line.e.n-' + n.dataset.id).forEach(l => {
      if (l.classList.contains('offch')) return;
      l.classList.add('hl');
      const h = [...l.classList].find(c => c.indexOf('h-') === 0).slice(2);
      const hk = svg.querySelector('.hook[data-h=&quot;' + h + '&quot;]');
      if (hk) hk.classList.add('hl');
    });
    showTip(n);
  });
  n.addEventListener('mousemove', moveTip);
  n.addEventListener('mouseleave', clearHl);
});
document.querySelectorAll('.hook').forEach(hk => {
  hk.addEventListener('mouseenter', () => {
    svg.classList.add('hov');
    hk.classList.add('hl');
    svg.querySelectorAll('line.e.h-' + hk.dataset.h).forEach(l => {
      if (l.classList.contains('offch')) return;
      l.classList.add('hl');
      [...l.classList].forEach(c => {
        if (c.indexOf('n-') === 0) {
          const nn = svg.querySelector('.n[data-id=&quot;' + c.slice(2) + '&quot;]');
          if (nn) nn.classList.add('hl');
        }
        if (c.indexOf('h-') === 0 &amp;&amp; c.slice(2) !== hk.dataset.h) {
          const oh = svg.querySelector('.hook[data-h=&quot;' + c.slice(2) + '&quot;]');
          if (oh) oh.classList.add('hl');
        }
      });
    });
    showTip(hk);
  });
  hk.addEventListener('mousemove', moveTip);
  hk.addEventListener('mouseleave', clearHl);
});
const HKS = [&quot;wet&quot;, &quot;frozen&quot;, &quot;burning&quot;, &quot;grease&quot;, &quot;barrier&quot;, &quot;clash&quot;];
const chs = new Set(HKS);
function applyCh() {
  svg.querySelectorAll('line.e').forEach(l => {
    const hs = [...l.classList].filter(c => c.indexOf('h-') === 0).map(c => c.slice(2));
    l.classList.toggle('offch', !hs.some(h => chs.has(h)));
  });
  svg.querySelectorAll('.hook').forEach(h =>
    h.style.opacity = chs.has(h.dataset.h) ? '' : '0.25');
  document.querySelectorAll('.lc').forEach(b => b.classList.toggle('on', chs.has(b.dataset.h)));
}
document.querySelectorAll('.lc').forEach(b => b.addEventListener('click', () => {
  if (chs.size === HKS.length) { chs.clear(); chs.add(b.dataset.h); }
  else if (chs.has(b.dataset.h)) { chs.delete(b.dataset.h); if (!chs.size) HKS.forEach(k => chs.add(k)); }
  else chs.add(b.dataset.h);
  applyCh();
}));
document.getElementById('allch').addEventListener('click', () => {
  HKS.forEach(k => chs.add(k));
  applyCh();
});
async function exportPNG() {
  const clone = svg.cloneNode(true);
  clone.querySelectorAll('line.e.offch').forEach(l => l.remove());
  clone.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
  const xml = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([xml], {type: 'image/svg+xml'}));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const c = document.createElement('canvas');
  c.width = 3000; c.height = 1920;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#101016';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
const copybtn = document.getElementById('copybtn');
function flashCopy(cls, text) {
  copybtn.classList.add(cls);
  copybtn.textContent = text;
  setTimeout(() => { copybtn.classList.remove(cls); copybtn.textContent = '⧉ copy image'; }, 2200);
}
copybtn.addEventListener('click', async () => {
  copybtn.textContent = '… rendering';
  try {
    const blob = await exportPNG();
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    flashCopy('ok', '✓ copied');
  } catch (e) {
    flashCopy('err', '✕ blocked');
  }
});
</script>

<script>
const q = document.getElementById('q');
const rows = [...document.querySelectorAll('#t tr')].slice(1);
q.addEventListener('input', () => {
  const v = q.value.toLowerCase();
  rows.forEach(r => r.style.display = r.textContent.toLowerCase().includes(v) ? '' : 'none');
});
document.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
  const k = +th.dataset.k;
  const dir = th.dataset.d === 'a' ? -1 : 1;
  document.querySelectorAll('th').forEach(x => delete x.dataset.d);
  th.dataset.d = dir === 1 ? 'a' : 'd';
  const body = rows[0].parentElement;
  rows.slice().sort((a, b) => {
    const va = a.cells[k].textContent.trim(), vb = b.cells[k].textContent.trim();
    if (k === 1) return dir * ((+vb.replace(/,/g, '') || 0) - (+va.replace(/,/g, '') || 0));
    return dir * va.localeCompare(vb);
  }).forEach(r => body.appendChild(r));
}));
</script>

<script>
function active() { return document.querySelector('iframe.on'); }
function fit(f) {
  try {
    f.style.height = Math.max(600, f.contentDocument.documentElement.scrollHeight + 4) + 'px';
  } catch (e) {}
}
document.querySelectorAll('iframe').forEach(f =>
  f.addEventListener('load', () => { if (f.classList.contains('on')) fit(f); }));
document.querySelectorAll('.mtabs a').forEach(a => a.addEventListener('click', () => {
  if (a.classList.contains('on')) return;
  document.querySelectorAll('.mtabs a').forEach(x => x.classList.toggle('on', x === a));
  document.querySelectorAll('iframe').forEach(f =>
    f.classList.toggle('on', f.dataset.v === a.dataset.v));
  setTimeout(() => { fit(active()); try { active().contentWindow.focus(); } catch (e) {} }, 0);
  setTimeout(() => fit(active()), 350);
}));
window.addEventListener('resize', () => fit(active()));
setTimeout(() => fit(active()), 600);
document.addEventListener('keydown', e => {
  const f = active();
  if (!f || !f.contentDocument) return;
  f.contentDocument.dispatchEvent(new KeyboardEvent('keydown',
    {key: e.key, bubbles: true, cancelable: true}));
  if ([' ', 'Backspace', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
});
</script>
